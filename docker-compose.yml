version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: katheval_app
    restart: always
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      # Coolify MySQL Connection Parameters
      - DB_HOST=${DB_HOST:-mysql}
      - DB_PORT=${DB_PORT:-3306}
      - DB_USER=${DB_USER:-root}
      - DB_PASSWORD=${DB_PASSWORD:-}
      - DB_NAME=${DB_NAME:-katheval_db}
      - DATABASE_URL=${DATABASE_URL:-}
      # App Security & Domain
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-katheval2026!}
      - DOMAIN=${DOMAIN:-katheval.al}
      - WHATSAPP_NUMBER=${WHATSAPP_NUMBER:-919733621111}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
