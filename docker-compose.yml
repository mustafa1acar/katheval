version: '3.8'

services:
  # 1. Otomatik MySQL Veritabanı Servisi (Veriler kalıcı volume'de saklanır)
  mysql:
    image: mysql:8.0
    container_name: katheval_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-kathevalbania099}
      MYSQL_DATABASE: ${DB_NAME:-katheval_db}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-kathevalbania099}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 2. Katheval Web Uygulaması (Frontend + Backend)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: katheval_app
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=${DB_PASSWORD:-kathevalbania099}
      - DB_NAME=${DB_NAME:-katheval_db}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-katheval2026!}
      - DOMAIN=${DOMAIN:-localhost}
      - WHATSAPP_NUMBER=${WHATSAPP_NUMBER:-919733621111}
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:5000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  mysql_data:
